<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd60a"/>
      <stop offset="100%" stop-color="#ff9f0a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- bolt icon -->
  <polygon points="150,70 105,165 140,165 120,230 195,120 155,120 175,70"
           fill="url(#bolt)"/>

  <text x="230" y="150" font-family="'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="64" font-weight="700" fill="#f0f6fc">Electron Detector</text>
  <text x="230" y="195" font-family="'SF Mono',Menlo,Consolas,monospace"
        font-size="24" fill="#8b949e">Find which of your Mac apps are secretly Electron</text>

  <!-- terminal dots -->
  <circle cx="1120" cy="60" r="7" fill="#ff5f56"/>
  <circle cx="1145" cy="60" r="7" fill="#ffbd2e"/>
  <circle cx="1170" cy="60" r="7" fill="#27c93f"/>
</svg>
