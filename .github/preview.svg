<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="944" viewBox="0 0 1100 944">
<rect width="1100" height="944" rx="20" fill="#14251e"/>
<circle cx="28" cy="28" r="6" fill="#ed978e"/><circle cx="48" cy="28" r="6" fill="#e5ca83"/><circle cx="68" cy="28" r="6" fill="#a3c6a4"/>
<text x="550" y="33" text-anchor="middle" fill="#a5b6aa" font-family="monospace" font-size="13">electron-detector.sh --demo</text>
<text x="24" y="77" xml:space="preserve" fill="#67d6ec" font-family="Menlo,Consolas,monospace" font-size="16">  ╭────────────────────────────────────────────────────────────────╮</text>
<text x="24" y="101" xml:space="preserve" fill="#67d6ec" font-family="Menlo,Consolas,monospace" font-size="16">  │  ⚡ Electron Detector for macOS                                 │</text>
<text x="24" y="125" xml:space="preserve" fill="#67d6ec" font-family="Menlo,Consolas,monospace" font-size="16">  │     Find out what is inside your Mac apps.                      │</text>
<text x="24" y="149" xml:space="preserve" fill="#67d6ec" font-family="Menlo,Consolas,monospace" font-size="16">  ╰────────────────────────────────────────────────────────────────╯</text>
<text x="24" y="173" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16"></text>
<text x="24" y="197" xml:space="preserve" fill="#e5ca83" font-family="Menlo,Consolas,monospace" font-size="16">  DEMO / fictional apps and sizes. Nothing scanned.</text>
<text x="24" y="221" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16"></text>
<text x="24" y="245" xml:space="preserve" fill="#bce6ad" font-family="Menlo,Consolas,monospace" font-size="16">  ✓ Scan complete · 3 Electron apps found</text>
<text x="24" y="269" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  42 apps inspected · 7% have Electron markers</text>
<text x="24" y="293" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16"></text>
<text x="24" y="317" xml:space="preserve" fill="#e5ca83" font-family="Menlo,Consolas,monospace" font-size="16">  ⚡ Electron apps · largest first</text>
<text x="24" y="341" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16"></text>
<text x="24" y="365" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  App                                 Disk size  App version     </text>
<text x="24" y="389" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  ────────────────────────────────────────────────────────────────</text>
<text x="24" y="413" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  Example Editor                      768.0 MiB  1.2.0</text>
<text x="24" y="437" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  Example Chat                        512.0 MiB  4.0.1</text>
<text x="24" y="461" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  Example Notes                       256.0 MiB  2.3.0</text>
<text x="24" y="485" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  ────────────────────────────────────────────────────────────────</text>
<text x="24" y="509" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16"></text>
<text x="24" y="533" xml:space="preserve" fill="#67d6ec" font-family="Menlo,Consolas,monospace" font-size="16">  📦 Disk footprint</text>
<text x="24" y="557" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  Detected app bundles: 1.5 GiB</text>
<text x="24" y="581" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  Whole app bundles; excludes user data and caches.</text>
<text x="24" y="605" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  Largest: Example Editor (50% of the detected footprint)</text>
<text x="24" y="629" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  This is disk usage, not RAM usage or potential savings.</text>
<text x="24" y="653" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  No marker found does not prove an app is native.</text>
<text x="24" y="677" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16"></text>
<text x="24" y="701" xml:space="preserve" fill="#e5ca83" font-family="Menlo,Consolas,monospace" font-size="16">  💡 Did you know?</text>
<text x="24" y="725" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  Electron bundles Chromium and Node.js inside desktop apps.</text>
<text x="24" y="749" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  These apps do not need Chrome installed to run.</text>
<text x="24" y="773" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  Curious about actual RAM use? Check Activity Monitor.</text>
<text x="24" y="797" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16"></text>
<text x="24" y="821" xml:space="preserve" fill="#bce6ad" font-family="Menlo,Consolas,monospace" font-size="16">  ✨ Find your next native Mac app</text>
<text x="24" y="845" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  Explore alternatives by category → https://macnative.io/categories</text>
<text x="24" y="869" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  Keep the apps you love. Try something new where it makes sense.</text>
<text x="24" y="893" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16"></text>
<text x="24" y="917" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  Tip: --interactive for sharing and evidence; --json for export.</text>
</svg>