<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="728" viewBox="0 0 1100 728">
<rect width="1100" height="728" rx="20" fill="#14251e"/>
<circle cx="28" cy="28" r="6" fill="#ed978e"/><circle cx="48" cy="28" r="6" fill="#e5ca83"/><circle cx="68" cy="28" r="6" fill="#a3c6a4"/>
<text x="550" y="33" text-anchor="middle" fill="#a5b6aa" font-family="monospace" font-size="13">electron-detector.sh --demo</text>
<text x="24" y="77" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  .--------.</text>
<text x="24" y="101" xml:space="preserve" fill="#bce6ad" font-family="Menlo,Consolas,monospace" font-size="16">  |  o  o  |   ELECTRON DETECTOR</text>
<text x="24" y="125" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  |   __   |   A little detective for your Mac.</text>
<text x="24" y="149" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  &#x27;--------&#x27;</text>
<text x="24" y="173" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16"></text>
<text x="24" y="197" xml:space="preserve" fill="#e5ca83" font-family="Menlo,Consolas,monospace" font-size="16">  DEMO / fictional apps and sizes. Nothing scanned.</text>
<text x="24" y="221" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16"></text>
<text x="24" y="245" xml:space="preserve" fill="#bce6ad" font-family="Menlo,Consolas,monospace" font-size="16">  YOUR MAC APP CENSUS / 3 Electron apps found.</text>
<text x="24" y="269" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  42 apps inspected · 7% with Electron markers</text>
<text x="24" y="293" xml:space="preserve" fill="#bce6ad" font-family="Menlo,Consolas,monospace" font-size="16">  [#...................]  3 matched / 39 without a marker</text>
<text x="24" y="317" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16"></text>
<text x="24" y="341" xml:space="preserve" fill="#bce6ad" font-family="Menlo,Consolas,monospace" font-size="16">  THE LINEUP / largest bundles first</text>
<text x="24" y="365" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16"></text>
<text x="24" y="389" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">   1. Example Editor  (768.0 MiB)</text>
<text x="24" y="413" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">      v1.2.0 · Electron Framework.framework</text>
<text x="24" y="437" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">   2. Example Chat  (512.0 MiB)</text>
<text x="24" y="461" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">      v4.0.1 · Electron Framework.framework</text>
<text x="24" y="485" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">   3. Example Notes  (256.0 MiB)</text>
<text x="24" y="509" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">      v2.3.0 · Contents/MacOS/Electron</text>
<text x="24" y="533" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16"></text>
<text x="24" y="557" xml:space="preserve" fill="#bce6ad" font-family="Menlo,Consolas,monospace" font-size="16">  Bundle footprint: 1.5 GiB</text>
<text x="24" y="581" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  This is disk usage, not RAM usage or potential savings.</text>
<text x="24" y="605" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  No marker found does not prove an app is native.</text>
<text x="24" y="629" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16"></text>
<text x="24" y="653" xml:space="preserve" fill="#bce6ad" font-family="Menlo,Consolas,monospace" font-size="16">  Keep the apps you love. Get curious about the rest.</text>
<text x="24" y="677" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  Explore native Mac apps → https://macnative.io/categories</text>
<text x="24" y="701" xml:space="preserve" fill="#dce5dc" font-family="Menlo,Consolas,monospace" font-size="16">  Tip: --json exports a report; --share leaves out app names.</text>
</svg>